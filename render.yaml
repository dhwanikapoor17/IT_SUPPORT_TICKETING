services:
  # ---------------------------------------------------------------------------
  # 1. FastAPI Backend API
  # ---------------------------------------------------------------------------
  - type: web
    name: it-support-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: it-support-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: dhwani.kapoor04@gmail.com
      - key: CORS_ORIGINS
        value: "*"

  # ---------------------------------------------------------------------------
  # 2. Next.js Frontend
  # ---------------------------------------------------------------------------
  - type: web
    name: it-support-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false

databases:
  - name: it-support-db
    databaseName: it_support_db
    user: postgres
    plan: free
